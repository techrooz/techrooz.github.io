name: TechRooz posting

# One run stays up ~5h45m and posts every queued item at its exact time,
# then starts the next run, so posting never stops. The schedule only
# restarts the chain if it ever breaks.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: techrooz-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install ffmpeg (for video posts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Post queued items on time
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          git config user.name "techrooz-bot"
          git config user.email "techrooz-bot@users.noreply.github.com"
          python3 scripts/post_queue.py --daemon 5.7
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run post.yml --repo "$GITHUB_REPOSITORY" --ref main
